name: qwencoder
description: "QwenCoder — Cliente Flutter para o proxy QwenBridge com suporte a tool calls, contas múltiplas e layout estilo Claude."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & SSE
  http: ^1.2.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # State management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2

  # Markdown rendering for AI responses
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2

  # Utilities
  uuid: ^4.5.1
  intl: any
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  file_picker: ^8.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0b0b0b"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
