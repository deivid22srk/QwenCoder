name: QwenCoder Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib/ || true

      - name: Analyze
        run: flutter analyze || true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK (debug)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: List built APKs
        run: |
          ls -la build/app/outputs/flutter-apk/ || true

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: qwencoder-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: qwencoder-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

  build-web:
    name: Build Web (Site)
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-tree-shake-icons

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwencoder-web
          path: build/web
          if-no-files-found: warn
          retention-days: 30

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/deploy-pages@v4
        with:
          artifact_name: qwencoder-web

  release-on-tag:
    name: Release APK on Tag
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: qwencoder-apk-release
          path: artifact

      - name: Rename APK
        run: |
          mv artifact/app-release.apk QwenCoder-${GITHUB_REF_NAME}.apk
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: QwenCoder-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
