<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="QwenCoder — Cliente Flutter para o proxy QwenBridge com tool calls e contas múltiplas.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="QwenCoder">
  <meta name="theme-color" content="#0b0b0b">

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>QwenCoder</title>

  <style>
    body { background: #0b0b0b; margin: 0; }
    #loader {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #d97757;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    #loader .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d97757;
      margin: 0 3px;
      animation: pulse 1.2s infinite ease-in-out;
    }
    #loader .dot:nth-child(2) { animation-delay: 0.2s; }
    #loader .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <p style="margin-top:12px;font-size:13px;color:#a8a29e;">Carregando QwenCoder…</p>
  </div>

  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) return;
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
    loadMainDartJs();
  </script>
</body>
</html>
